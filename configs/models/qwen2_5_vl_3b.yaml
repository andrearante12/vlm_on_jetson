# Qwen2.5-VL-3B-Instruct in transformers. ~7.5 GB fp16: does NOT fit the 8GB Orin Nano; use the
# GGUF config there. Strong at grounding (outputs absolute pixel boxes of the resized input).
backend: hf
family: auto
model_id: Qwen/Qwen2.5-VL-3B-Instruct
processor_kwargs:
  min_pixels: 200704     # 256 * 28 * 28
  max_pixels: 802816     # 1024 * 28 * 28 -> at most ~1024 visual tokens
bbox_format: pixels
